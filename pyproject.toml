[project]
name = "pypiccolo"
version = "0.1.0.a1"
description = "Python wrapper of Piccolo.jl"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = [
    "quantum",
    "physics",
    "dynamics",
]
authors = [
    {name = "Gennadi Ryan", email = "gennadiryan@gmail.com"},
    {name = "Jack Champagne", email = "jackchampagne.r@gmail.com"},
]
maintainers = [
    { name = "Gennadi Ryan", email = "gennadiryan@gmail.com" },
    { name = "Jack Champagne", email = "jchampag@andrew.cmu.edu" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Quantum Computing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=2.2<3.0"
]

[project.optional-dependencies]
tests = [
    "pytest>=8.3",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

